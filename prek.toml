[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
language = "system"
entry = "cargo clippy --workspace --all-targets"
args = ["--", "-D", "warnings"]
files = "\\.rs$|Cargo\\.toml"
pass_filenames = false

[[repos.hooks]]
id = "cargo-test"
name = "cargo test"
language = "system"
entry = "cargo test --workspace"
files = "\\.rs$|Cargo\\.toml"
pass_filenames = false
