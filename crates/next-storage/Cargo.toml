[package]
name = "next-storage"
version = "0.1.0"
edition = "2021"

[dependencies]
next = { path = "../next" }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs4 = "0.8"
git2 = "0.19"
uuid = { version = "1", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
chrono = "0.4"
