[package]
name = "next-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "next"
path = "src/main.rs"

[dependencies]
next = { path = "../next" }
next-storage = { path = "../next-storage" }
next-remote-storage = { path = "../next-remote-storage" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
toml = "0.8"
dirs = "5"
serde_json = "1"
chrono = "0.4"
uuid = "1"
