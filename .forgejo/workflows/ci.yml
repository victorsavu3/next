name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache
        uses: https://github.com/Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --features mcp -- -D warnings

      - name: Test
        run: cargo test --features mcp
