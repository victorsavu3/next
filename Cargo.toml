[package]
name = "next"
version = "0.4.0"
edition = "2021"

[features]
default = []
mcp = [
    "dep:tokio",
    "dep:axum",
    "dep:sha2",
    "dep:base64",
]

[[bin]]
name = "next"
path = "src/main.rs"

[[bin]]
name = "next-mcp"
path = "src/mcp/main.rs"
required-features = ["mcp"]

[dependencies]
# domain / core
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
interim = { version = "0.2", features = ["chrono_0_4"] }
# storage
toml = "0.8"
fs4 = "0.8"
git2 = "0.19"
rusqlite = { version = "0.32", features = ["bundled"] }
# CLI
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dirs = "5"
# MCP server (optional — enabled by the `mcp` feature)
tokio  = { version = "1", optional = true, features = ["full"] }
axum   = { version = "0.8", optional = true }
sha2   = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
tempfile = "3"
# Used by MCP integration tests (#[cfg(feature = "mcp")] blocks).
# dev-dependencies cannot be made optional, so these are compiled for all
# test runs but the actual test code is gated by the feature flag.
tokio           = { version = "1", features = ["full"] }
reqwest         = { version = "0.12", features = ["json"] }
testcontainers  = "0.23"
sha2            = "0.10"
base64          = "0.22"
