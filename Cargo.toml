[package]
name = "next"
version = "1.1.0"
edition = "2021"

[features]
# With no features the crate is just the `core` library (domain, storage, store,
# plugin, scoring, service, recurrence, config) that other crates can link
# without the CLI or its dependencies. The CLI (including `AppContext`) lives in
# `src/cli/`. The default build still includes the CLI.
default = ["cli"]
cli = [
    "dep:clap",
    "dep:tracing-subscriber",
]
mcp = [
    "dep:tokio",
    "dep:axum",
    "dep:tracing-subscriber",
]
forgejo = [
    "dep:tokio",
    "dep:forgejo-api",
    "dep:url",
    "dep:clap",
    "dep:tracing-subscriber",
]
tui = [
    "dep:ratatui",
    "dep:tui-input",
    "dep:tui-textarea-2",
    "dep:tracing-subscriber",
]

[[bin]]
name = "next"
path = "src/cli/main.rs"
required-features = ["cli"]

[[bin]]
name = "next-mcp"
path = "src/mcp/main.rs"
required-features = ["mcp"]

[[bin]]
name = "next-forgejo"
path = "src/forgejo/main.rs"
required-features = ["forgejo"]

[[bin]]
name = "next-tui"
path = "src/tui/main.rs"
required-features = ["tui"]

[dependencies]
# domain / core
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
interim = { version = "0.2", features = ["chrono_0_4"] }
# storage
toml = "0.8"
fs4 = "0.8"
git2 = "0.19"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
dirs = "5"
# Logging
tracing = "0.1"
# CLI / binary deps (optional — enabled by the cli/mcp/forgejo features)
clap = { version = "4", optional = true, features = ["derive"] }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
# MCP server (optional — enabled by the `mcp` feature)
tokio = { version = "1", optional = true, features = ["full"] }
axum  = { version = "0.8", optional = true }
# Forgejo plugin (optional — enabled by the `forgejo` feature)
forgejo-api = { version = "0.10", optional = true }
url         = { version = "2", optional = true }
# Terminal UI (optional — enabled by the `tui` feature). We rely on ratatui's
# re-exported `crossterm` (ratatui::crossterm) instead of a direct crossterm
# dependency, so that only a single crossterm version is ever pulled in.
ratatui = { version = "0.30", optional = true }
tui-input = { version = "0.15", optional = true }
# Multi-line text editor widget for the TUI edit modal. `tui-textarea-2` 0.11
# targets ratatui 0.30 and reuses its crossterm (0.29), so only a single
# crossterm version is ever pulled in.
tui-textarea-2 = { version = "0.11", optional = true }

[dev-dependencies]
tempfile = "3"
# Used by MCP integration tests (#[cfg(feature = "mcp")] blocks).
# dev-dependencies cannot be made optional, so these are compiled for all
# test runs but the actual test code is gated by the feature flag.
tokio           = { version = "1", features = ["full", "test-util"] }
reqwest         = { version = "0.12", features = ["json"] }
testcontainers  = "0.23"
